# ==============================================================================
# tlrc/config.toml — tlrc (the official Rust tldr client)
# ==============================================================================
#
# WHAT THIS FILE IS
#   Configuration for `tldr`, which prints community-written, example-first
#   summaries of commands.
#
# ONE FILE, TWO PLATFORMS
#   tlrc reads ~/.config/tlrc/config.toml on Linux (honouring $XDG_CONFIG_HOME)
#   but ~/Library/Application Support/tlrc/config.toml on macOS. The package
#   ships the XDG path, and install.sh symlinks the macOS location at it, so
#   one file serves both; see ../../../README.md § Per-OS configuration.
#   `tldr --config-path` prints the path in use. The alternative, the
#   TLRC_CONFIG environment variable, would apply only to shells that export it.
#
# REGENERATING
#   `tldr --gen-config` prints the complete default configuration; the
#   defaults below were taken from it. After upgrading tlrc, diff to find new
#   keys:
#       tldr --gen-config | diff - "$(tldr --config-path)"
#
#   Manual: https://tldr.sh/tlrc/
# ==============================================================================

[cache]
# WHAT: Where the pages are downloaded from.
# WHY : The default: the tldr-pages release archive.
# NOTE: The `dir` key is not set. tlrc picks a per-platform cache location
#       (~/Library/Caches/tlrc on macOS, ~/.cache/tlrc on Linux); a hardcoded
#       macOS path would create a stray ~/Library on Linux.
mirror = "https://github.com/tldr-pages/tldr/releases/latest/download" # default: this URL

# WHAT: Refresh the cache automatically once it is older than max_age hours.
# WHY : Both defaults. 336 hours is two weeks.
auto_update = true # default: true
max_age = 336 # default: 336

# WHAT: Run that update after printing the page rather than before.
# WHY : On. With the default, off, the lookup that crosses the two-week
#       boundary waits for a download before showing anything.
defer_auto_update = true # default: false

# WHAT: Page languages to download; English is always included.
# WHY : Left empty, the default, tlrc infers languages from $LANG and
#       $LANGUAGE and downloads those too. Translated pages are less complete
#       and add cache size.
# HOW : Add ISO codes, e.g. languages = ["en", "de"].
languages = ["en"] # default: []

[output]
# WHAT: Print the command name as a heading above the page.
# WHY : The default. Off, several pages read in a row are hard to tell apart.
show_title = true # default: true

# WHAT: Append the platform (osx, linux, common) to that heading.
# WHY : Off, the default; the platform is the machine's own. On, it shows
#       which platform directory the page came from, whose content differs.
platform_title = false # default: false

# WHAT: Prefix each example description with `example_prefix`.
# WHY : Off, the default. The descriptions already read as a list and the
#       style tables below colour them. The prefix is the default value and
#       applies only when show_hyphens is on.
show_hyphens = false # default: false
example_prefix = "- " # default: "- "

# WHAT: Print a link to edit the page on GitHub.
# WHY : Off, the default; useful only when contributing a fix.
edit_link = false # default: false

# WHAT: Strip blank lines between examples.
# WHY : Off, the default. Compact output fits more on screen, but the blank
#       lines separate the examples.
# HOW : Set true to save vertical space on a short terminal.
compact = false # default: false

# WHAT: Maximum line width; 0 means the terminal width.
# WHY : The default. A fixed width would wrap early on a wide terminal.
line_length = 0 # default: 0

# WHAT: Which form of a flag to show when a page documents both.
# WHY : "long", the default. `--recursive` explains itself where `-r` does
#       not, and these pages are for commands used rarely.
# HOW : "short", "long", or "both".
option_style = "long" # default: "long"

# WHAT: Print the raw markdown instead of rendering it.
# WHY : Off, the default. On is for piping into another tool.
raw_markdown = false # default: false

[indent]
# WHAT: Leading spaces for each element of a rendered page.
# WHY : The defaults. The four-space example indent nests commands under their
#       descriptions.
title = 2 # default: 2
description = 2 # default: 2
bullet = 2 # default: 2
example = 4 # default: 4

# ------------------------------------------------------------------------------
# Styling
# ------------------------------------------------------------------------------
# WHAT: Colours and attributes per page element. Each [style.*] table takes
#       color, background, and the booleans bold, underline, italic, dim, and
#       strikethrough. Colours may be a name, a 256-colour number, an
#       [r, g, b] array, or a hex string.
# WHY : These are tlrc's defaults, kept because they are palette names rather
#       than fixed RGB: they resolve through the terminal's own colours and
#       follow Ghostty's light/dark switch (see ../../../README.md § Light and
#       dark). Hex values would pin one flavour.

# Command name heading.
[style.title]
color = "magenta"
background = "default"
bold = true

# The page description under the heading.
[style.description]
color = "magenta"
background = "default"

# The bullet or description line of each example.
[style.bullet]
color = "green"
background = "default"

# The example command itself.
[style.example]
color = "cyan"
background = "default"

# URLs in the page.
[style.url]
color = "red"
background = "default"
italic = true

# Inline code in descriptions.
[style.inline_code]
color = "yellow"
background = "default"
italic = true

# Placeholders such as {{file}} inside examples.
[style.placeholder]
color = "red"
background = "default"
italic = true
