# ==============================================================================
# os-darwin.conf — Ghostty settings that only apply on macOS
# ==============================================================================
#
# Loaded by the `config-file = ?os.conf` line at the bottom of `config`, via a
# symlink that install.sh points here on macOS. Because the include is last,
# anything set here overrides the base config.
#
# Same format rules as the base file: no trailing comments (everything after
# `=` is the value), repeatable keys append, unknown keys are ignored silently.
# Validate with `ghostty +validate-config` and check the RESULT with
# `ghostty +show-config`.
#
# Ghostty compiles every platform's keys into its schema on all platforms, so
# the macOS keys below would parse and validate on Linux too — they would just
# do nothing. They live here anyway so the config states what it means.
# ==============================================================================

# --- Keyboard -------------------------------------------------------------------
# WHAT: Treat the LEFT Option key as Alt/Meta; the right one keeps composing
#       macOS special characters (é, ß, …).
# WHY : REQUIRED for Neovim's <M-j> / <M-k> line-moving keymaps to work in the
#       terminal — without it macOS swallows Option as a compose modifier and
#       those mappings are simply dead. Mirrors
#       vim.g.neovide_input_macos_option_key_is_meta = "only_left".
#       Linux needs no equivalent: Alt is already Meta there.
# HOW : Values: true, false, left, right.
# default: false
macos-option-as-alt = left

# --- Rendering --------------------------------------------------------------------
# WHAT: Render glyphs with a slightly thicker stroke.
# WHY : Compensates for macOS's thin subpixel rendering on non-Retina and
#       scaled displays. The key is macOS-only; Linux font rendering is handled
#       by fontconfig instead.
# default: false
font-thicken = true

# --- Keybinds ---------------------------------------------------------------------
# These MIRROR Ghostty's current macOS defaults, stated explicitly so the config
# documents its own interface and keeps working if upstream defaults change.
# `super` is ⌘ here. The Linux file uses Ctrl+Shift for the same actions.
#
# Splits
keybind = super+d=new_split:right
keybind = super+shift+d=new_split:down
keybind = super+shift+enter=toggle_split_zoom
#
# Split navigation (⌘⌥ + arrows moves directionally)
keybind = super+alt+arrow_left=goto_split:left
keybind = super+alt+arrow_right=goto_split:right
keybind = super+alt+arrow_up=goto_split:up
keybind = super+alt+arrow_down=goto_split:down
#
# Tabs and surfaces
keybind = super+t=new_tab
keybind = super+w=close_surface
#
# Config
keybind = super+shift+comma=reload_config
