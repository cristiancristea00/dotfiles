# ==============================================================================
# ruff.toml — Ruff's user-level configuration (Python linting and formatting)
# ==============================================================================
#
# WHAT THIS FILE IS
#   Ruff's settings for Python files that belong to no configured project,
#   deployed to ~/.config/ruff/ruff.toml.
#
#   It is a fallback. Ruff does not merge configuration files: it uses the
#   closest pyproject.toml, ruff.toml, or .ruff.toml found walking up from the
#   file being checked, and reads this file only when that search finds
#   nothing. No Ruff setting can impose anything on a project that has its own
#   configuration.
#
# WHERE RUFF LOOKS, AND WHY THIS FILENAME
#   From `find_user_settings_toml` in Ruff's source
#   (crates/ruff_workspace/src/pyproject.rs):
#
#       let strategy = etcetera::base_strategy::choose_base_strategy()?;
#       let config_dir = strategy.config_dir().join("ruff");
#       for filename in [".ruff.toml", "ruff.toml", "pyproject.toml"] { ... }
#
#   The docs name only `${config_dir}/ruff/pyproject.toml`, which would have
#   meant nesting every setting under [tool.ruff]. The source searches three
#   names, so `ruff.toml` is accepted; a `.ruff.toml` in the same directory
#   would win over it. The directory is ~/.config/ruff/ on macOS as well as
#   Linux, because the base strategy is XDG on both; the native strategy,
#   which would put the file under ~/Library/Application Support on macOS, is
#   not used in Ruff. This package therefore needs none of the per-OS
#   mechanism tlrc needs (see ../../../tlrc/README.md).
#
# WHO READS IT
#   The `ruff` CLI, the ruff language server Neovim attaches through
#   ../../../nvim/.config/nvim/after/lsp/ruff.lua, and the `charliermarsh.ruff`
#   extension in Visual Studio Code and Cursor. All run the same binary.
#   ../../README.md has the command that verifies the file is read.
# ==============================================================================

# WHAT: Directories excluded in addition to Ruff's built-in list (.git, .venv,
#       __pypackages__, node_modules, and others).
# WHY : Build output. The `extend-exclude` key adds to the built-in list;
#       `exclude` would replace it.
extend-exclude = ["target", "build", "out", "output"] # default: []

# WHAT: Whether `ruff check` applies its fixes instead of only reporting them.
# WHY : On. Every editor here formats only on <leader>F, so this is the only
#       tool that rewrites a file when run. Only fixes Ruff marks safe are
#       applied; `--unsafe-fixes` would apply the rest and is not enabled.
# HOW : Set false to report only, or pass `--no-fix` for one run.
fix = true # default: false

# WHAT: The line length the linter enforces and the formatter targets.
# WHY : 120 is one of the four column guides every editor here draws; see
#       ../../../README.md § Column guides.
line-length = 120 # default: 88

# WHAT: Spaces per indentation level.
# WHY : Four, the repo-wide rule.
indent-width = 4 # default: 4

# ==============================================================================
# LINTING
# ==============================================================================

[lint]

# WHAT: Enable Ruff's preview (unstable) rules.
# WHY : About a fifth of the rules selected below are preview-only: DOC
#       entirely, and large parts of E, RUF, FURB, and PLR. Without this they
#       would do nothing.
# NOTE: Preview rules can change behaviour, be renamed, or be withdrawn
#       between releases, so a `brew upgrade ruff` can change what lints with
#       no change here.
preview = true # default: false

# WHAT: The rule families to enable, by prefix.
# WHY : A broad selection. A rule that is wrong for a project is silenced in
#       that project's own configuration, or here with an `ignore` list.
# HOW : Prefixes select whole families; a full code selects one rule.
#       `ruff rule <code>` explains one; `ruff linter` lists every family.
select = [
    # --- Correctness and likely bugs ------------------------------------------
    "F",        # Pyflakes: undefined names, unused imports, broken f-strings
    "B",        # flake8-bugbear: mutable defaults, loop-variable capture
    "A",        # flake8-builtins: shadowing `list`, `id`, `type`
    "SIM",      # flake8-simplify: collapsible ifs, redundant bool conversion
    "RET",      # flake8-return: unnecessary else-after-return
    "PIE",      # flake8-pie: assorted redundancy
    "RUF",      # Ruff's own rules, including mutable class defaults
    "SLF",      # flake8-self: reaching into another object's _private
    "ARG",      # flake8-unused-arguments: parameters a function never uses

    # --- Typing ---------------------------------------------------------------
    "ANN",      # flake8-annotations: missing signature types
    "FA",       # flake8-future-annotations: `from __future__ import annotations`

    # --- Style and naming -----------------------------------------------------
    "E",        # pycodestyle errors
    "W",        # pycodestyle warnings
    "N",        # pep8-naming: class, function, and variable naming
    "C",        # flake8-comprehensions and mccabe complexity
    "FURB",     # refurb: dated idioms with a modern replacement

    # --- Documentation --------------------------------------------------------
    "D",        # pydocstyle: docstring presence and formatting
    "DOC",      # pydoclint: docstrings that disagree with the signature
    "CPY",      # flake8-copyright: every file carries a copyright notice

    # --- Errors, logging, and messages ----------------------------------------
    "EM",       # flake8-errmsg: string literals passed straight to an exception
    "LOG",      # flake8-logging
    "G",        # flake8-logging-format: no f-strings in log calls

    # --- Paths and performance ------------------------------------------------
    "PTH",      # flake8-use-pathlib: pathlib over os.path
    "PERF",     # perflint: avoidable work in loops

    # --- Scientific stack -----------------------------------------------------
    "NPY",      # NumPy-specific rules, including deprecated APIs
    "PD",       # pandas-vet

    # --- Pylint ---------------------------------------------------------------
    "PLC",      # Pylint conventions
    "PLE",      # Pylint errors
    "PLR",      # Pylint refactoring suggestions
    "PLW",      # Pylint warnings

    # --- Housekeeping ---------------------------------------------------------
    "FIX",      # flake8-fixme: flags TODO and FIXME so they are not forgotten
]

# WHAT: How `if TYPE_CHECKING:` imports are handled.
# WHY : The `strict` setting moves every import used only in annotations into
#       the type-checking block; `quote-annotations` quotes the references so
#       they stay valid at runtime without `from __future__ import
#       annotations`. Both are off by default. Together they cut import time
#       in heavily typed modules.
[lint.flake8-type-checking]
quote-annotations = true # default: false
strict = true # default: false

# WHAT: Import sorting.
# WHY : With `from-first`, `from x import y` goes above plain `import x`, the
#       inverse of isort's default. With `combine-as-imports`, `from x import a
#       as b` lines merge into one statement. Two blank lines after the imports
#       and one between the import types are layout choices.
# HOW : `ruff check --select I --fix` sorts imports; these settings decide the
#       shape.
[lint.isort]
combine-as-imports = true # default: false
from-first = true # default: false
lines-after-imports = 2 # default: -1 (Ruff decides)
lines-between-types = 1 # default: 0

# WHAT: The line-length limits pycodestyle enforces.
# WHY : Both equal `line-length` above. The `max-doc-length` key has no
#       default, so without it long lines in docstrings and comments go
#       unreported while code lines are checked.
[lint.pycodestyle]
max-doc-length = 120 # default: none
max-line-length = 120 # default: line-length

# ==============================================================================
# FORMATTING
# ==============================================================================

[format]

# WHAT: Quote character for strings the formatter rewrites.
# WHY : Single quotes, the house style here. The formatter still uses
#       whichever quote avoids escaping in a given string.
quote-style = "single" # default: "double"

# WHAT: Indent with spaces or tabs.
# WHY : Spaces, the default and the repo-wide rule.
indent-style = "space" # default: "space"

# WHAT: Whether a trailing comma forces a collection to stay one element per
#       line.
# WHY : False means the magic trailing comma is respected; the option asks
#       whether to skip it. A comma after the last element then pins a layout
#       the formatter would otherwise collapse.
skip-magic-trailing-comma = false # default: false

# WHAT: Line endings written by the formatter.
# WHY : Always LF. The default, "auto", infers the ending from the first line
#       ending in the file, so a file edited on Windows would keep CRLF.
line-ending = "lf" # default: "auto"

# WHAT: Also format Python code inside docstrings, at the given line length.
# WHY : On, so doctests and example blocks are formatted like code. The length
#       is fixed at 120; the default, "dynamic", fits the code to the width
#       left after the docstring's indentation.
docstring-code-format = true # default: false
docstring-code-line-length = 120 # default: "dynamic"
