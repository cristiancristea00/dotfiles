# ==============================================================================
# os-linux.conf — Ghostty settings that only apply on Linux
# ==============================================================================
#
# Loaded by the `config-file = ?os.conf` line at the bottom of `config`, via a
# symlink that install.sh points here on Linux. Because the include is last,
# anything set here overrides the base config.
#
# Same format rules as the base file: no trailing comments (everything after
# `=` is the value), repeatable keys append, unknown keys are ignored silently.
# Validate with `ghostty +validate-config` and check the RESULT with
# `ghostty +show-config`.
# ==============================================================================

# --- Keybinds ---------------------------------------------------------------------
# WHY THIS FILE EXISTS AT ALL: the macOS file binds these actions to `super`
# (⌘). On Linux `super` is the Windows key, which desktop environments claim
# for themselves — GNOME opens the Activities Overview on it, KDE opens the
# application launcher. Those bindings would register successfully and then
# never fire, which is worse than not setting them.
#
# Ctrl+Shift is the convention every Linux terminal uses (and Ghostty's own
# Linux defaults), because plain Ctrl+key is reserved for control characters:
# Ctrl+C must stay SIGINT, Ctrl+D must stay EOF.
#
# Splits
keybind = ctrl+shift+d=new_split:right
keybind = ctrl+shift+e=new_split:down
keybind = ctrl+shift+enter=toggle_split_zoom
#
# Split navigation (Ctrl+Alt + arrows moves directionally)
keybind = ctrl+alt+arrow_left=goto_split:left
keybind = ctrl+alt+arrow_right=goto_split:right
keybind = ctrl+alt+arrow_up=goto_split:up
keybind = ctrl+alt+arrow_down=goto_split:down
#
# Tabs and surfaces
keybind = ctrl+shift+t=new_tab
keybind = ctrl+shift+w=close_surface
#
# Config
keybind = ctrl+shift+comma=reload_config

# --- Documented extension points (inactive) ------------------------------------------
# WHAT: Window decoration mode, the Linux counterpart to macOS's
#       macos-titlebar-style. "auto" lets the compositor decide; "none" removes
#       the titlebar for a tiling-window-manager setup.
# default: auto
# window-decoration = auto
#
# WHAT: Where GTK draws the tab bar, and whether the titlebar is used at all.
# gtk-titlebar = true
# gtk-tabs-location = top
#
# NOTE: background-blur in the base config depends on the compositor on Linux.
#       KWin and Hyprland implement it; plain GNOME/Mutter does not, where the
#       setting simply has no effect.
